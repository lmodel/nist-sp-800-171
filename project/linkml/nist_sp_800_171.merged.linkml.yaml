  "enums": {
    "Sp800171RequirementStatus": {
      "name": "Sp800171RequirementStatus",
      "description": "The one status SP 800-171 Revision 3 states for a requirement. A requirement in force carries none.",
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "see_also": [
        "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
      ],
      "permissible_values": {
        "withdrawn": {
          "text": "withdrawn",
          "description": "Revision 3 withdrew the requirement; other requirements incorporate or address what it required, or nothing does."
        }
      }
    },
    "Sp800171AssessmentMethodKind": {
      "name": "Sp800171AssessmentMethodKind",
      "description": "The three assessment methods of SP 800-171A.",
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "see_also": [
        "https://doi.org/10.6028/NIST.SP.800-171Ar3"
      ],
      "permissible_values": {
        "examine": {
          "text": "examine",
          "description": "Reviewing, inspecting, observing, studying or analysing assessment objects such as policies, plans, records and configurations."
        },
        "interview": {
          "text": "interview",
          "description": "Holding discussions with people such as administrators and personnel with security responsibilities."
        },
        "test": {
          "text": "test",
          "description": "Exercising mechanisms or processes under specified conditions and comparing the result with what is expected."
        }
      }
    },
    "Sp800171SelectionCount": {
      "name": "Sp800171SelectionCount",
      "description": "How many choices a selection parameter takes, as OSCAL states it.",
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "permissible_values": {
        "one": {
          "text": "one",
          "description": "Exactly one of the choices."
        },
        "one_or_more": {
          "text": "one_or_more",
          "description": "One or more of the choices."
        }
      }
    }
  },
  "slots": {
    "title": {
      "name": "title",
      "description": "The name SP 800-171 gives a family or a security requirement, such as Access Control or Account Management.",
      "comments": [
        "It means what LOKF's title means and carries the same IRI, so lokf adapt folds it into LOKF's slot and a knowledge bundle reads one title key."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "slot_uri": "schema:name",
      "domain_of": [
        "Sp800171Family",
        "Sp800171Requirement"
      ]
    },
    "description": {
      "name": "description",
      "description": "What the family or requirement is about, in the words of whoever records it. SP 800-171 gives a family no text of its own, and a requirement's own text goes in its statement, items and discussion.",
      "comments": [
        "It means what LOKF's description means and carries the same IRI, so lokf adapt folds it into LOKF's slot and a knowledge bundle reads one description key."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "slot_uri": "schema:description",
      "domain_of": [
        "Sp800171Family",
        "Sp800171Requirement"
      ]
    },
    "family_number": {
      "name": "family_number",
      "description": "The family's number, such as 03.01.",
      "comments": [
        "A slot of its own, listed first in Sp800171Family's slots, rather than an attribute, so that the generated Python dataclasses key a list of families by their number and not by their title: they key an inlined list by the first required slot of the class, and a class lists its slots before its attributes. The adapt copy roots the family on LOKF's Concept, whose id is its identifier, so the number cannot be marked as one."
      ],
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "domain_of": [
        "Sp800171Family"
      ],
      "range": "sp800171_family_identifier",
      "required": true
    }
  },
