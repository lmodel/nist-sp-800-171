          "owner": "Sp800171Requirement",
          "domain_of": [
            "Sp800171Requirement"
          ],
          "range": "sp800171_requirement_identifier",
          "multivalued": true
        },
        "addressed_by_requirements": {
          "name": "addressed_by_requirements",
