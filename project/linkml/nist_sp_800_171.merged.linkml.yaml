        "oscal:Catalog"
      ],
      "attributes": {
        "sp800171_revision": {
          "name": "sp800171_revision",
          "description": "The revision of SP 800-171 the document renders, as NIST numbers it, such as 3.",
          "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
          "owner": "Sp800171Publication",
          "domain_of": [
            "Sp800171Publication"
          ],
          "range": "string",
          "required": true,
          "pattern": "^[1-9][0-9]*$"
        },
        "requirement_families": {
          "name": "requirement_families",
          "description": "The requirement families, in the order SP 800-171 gives them.",
          "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
          "owner": "Sp800171Publication",
          "domain_of": [
            "Sp800171Publication"
          ],
          "range": "Sp800171Family",
          "required": true,
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true,
          "minimum_cardinality": 1
        }
      },
      "class_uri": "nist_sp_800_171:Publication",
      "tree_root": true
    },
    "Sp800171Family": {
      "name": "Sp800171Family",
      "description": "One of the seventeen families that SP 800-171 Revision 3 sorts its security requirements into, such as Access Control (03.01) or Supply Chain Risk Management (03.17).",
      "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
      "see_also": [
        "https://csrc.nist.gov/pubs/sp/800/171/r3/final"
      ],
      "broad_mappings": [
        "oscal:Group"
      ],
      "slots": [
        "family_number",
        "title",
        "description"
      ],
      "slot_usage": {
        "title": {
          "name": "title",
          "required": true
        }
      },
      "attributes": {
        "family_requirements": {
          "name": "family_requirements",
          "description": "The security requirements of the family, the withdrawn ones included, in the order SP 800-171 numbers them. A knowledge bundle relates a requirement to its family with isPartOf instead.",
          "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
          "owner": "Sp800171Family",
          "domain_of": [
            "Sp800171Family"
          ],
          "range": "Sp800171Requirement",
          "multivalued": true,
          "inlined": true,
          "inlined_as_list": true
        },
        "family_number": {
          "name": "family_number",
          "description": "The family's number, such as 03.01.",
          "comments": [
            "A slot of its own, listed first in Sp800171Family's slots, rather than an attribute, so that the generated Python dataclasses key a list of families by their number and not by their title: they key an inlined list by the first required slot of the class, and a class lists its slots before its attributes. The adapt copy roots the family on LOKF's Concept, whose id is its identifier, so the number cannot be marked as one."
          ],
          "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
          "owner": "Sp800171Family",
          "domain_of": [
            "Sp800171Family"
          ],
          "range": "sp800171_family_identifier",
          "required": true
        },
        "title": {
          "name": "title",
          "description": "The name SP 800-171 gives a family or a security requirement, such as Access Control or Account Management.",
          "comments": [
            "It means what LOKF's title means and carries the same IRI, so lokf adapt folds it into LOKF's slot and a knowledge bundle reads one title key."
          ],
          "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
          "slot_uri": "schema:name",
          "owner": "Sp800171Family",
          "domain_of": [
            "Sp800171Family",
            "Sp800171Requirement"
          ],
          "range": "string",
          "required": true
        },
        "description": {
          "name": "description",
          "description": "What the family or requirement is about, in the words of whoever records it. SP 800-171 gives a family no text of its own, and a requirement's own text goes in its statement, items and discussion.",
          "comments": [
            "It means what LOKF's description means and carries the same IRI, so lokf adapt folds it into LOKF's slot and a knowledge bundle reads one description key."
          ],
          "from_schema": "https://w3id.org/lmodel/nist-sp-800-171",
          "slot_uri": "schema:description",
          "owner": "Sp800171Family",
          "domain_of": [
            "Sp800171Family",
            "Sp800171Requirement"
          ],
          "range": "string"
        }
      },
      "class_uri": "nist_sp_800_171:Family"
    },
    "Sp800171Requirement": {
      "name": "Sp800171Requirement",
