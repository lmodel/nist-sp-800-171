 syntax="proto3";
 package
// metamodel_version: 1.7.0
// version: 3.0.0
// One of the three assessment methods SP 800-171A applies to a requirement, examine, interview or test, with the assessment objects (documents, people, processes or mechanisms) it is applied to.
message Sp800171AssessmentMethod
 {
  sp800171AssessmentMethodKind requirementMethodKind = 0
 repeated  string requirementMethodObjects = 0
 }
// An assessment objective of SP 800-171A: one determination statement that an assessor checks, tied to the requirement or to one item of its statement.
message Sp800171AssessmentObjective
 {
  sp800171ObjectiveIdentifier requirementObjectiveId = 0
  string requirementDetermination = 0
  sp800171ItemIdentifier assessedRequirementItem = 0
 }
// One of the seventeen families that SP 800-171 Revision 3 sorts its security requirements into, such as Access Control (03.01) or Supply Chain Risk Management (03.17).
message Sp800171Family
 {
  string title = 0
  string description = 0
  sp800171FamilyIdentifier familyNumber = 0
 repeated  sp800171Requirement familyRequirements = 0
 }
// An organization-defined parameter (ODP): a value, such as a time period or a frequency, that a requirement statement leaves to the organization, with the guideline SP 800-171A gives for defining it. A few parameters are a selection among choices instead of a value.
message Sp800171Parameter
 {
  sp800171OdpIdentifier odpId = 0
  string odpLabel = 0
  string odpUsage = 0
  string odpGuideline = 0
 repeated  string odpChoices = 0
  sp800171SelectionCount odpSelectionCount = 0
 }
// One revision of SP 800-171 as a whole: its requirement families, each holding its security requirements, with the assessment procedures of the matching revision of SP 800-171A inside each requirement.
message Sp800171Publication
 {
  string sp800171Revision = 0
 repeated  sp800171Family requirementFamilies = 0
 }
// A publication that SP 800-171 lists under a requirement's references, by the short name the publication gives it, with the full citation and the address NIST's catalog gives it.
message Sp800171Reference
 {
  sp800171CitedPublicationName citedPublication = 0
  string citedPublicationCitation = 0
  uri citedPublicationUrl = 0
 }
// A security requirement of SP 800-171: a numbered, named requirement for protecting CUI, with its statement, discussion, references and source controls, the organization-defined parameters its statement leaves open, and the assessment objectives and methods SP 800-171A gives it. A requirement that Revision 3 withdrew keeps its number and says which requirements took its place.
message Sp800171Requirement
 {
  string title = 0
  string description = 0
  sp800171RequirementIdentifier requirementId = 0
  sp800171RequirementStatus requirementStatus = 0
 repeated  sp800171RequirementIdentifier incorporatedIntoRequirements = 0
 repeated  sp800171RequirementIdentifier addressedByRequirements = 0
  string requirementStatement = 0
 repeated  sp800171RequirementItem requirementItems = 0
  string requirementDiscussion = 0
 repeated  sp800171Parameter requirementParameters = 0
 repeated  sp800171AssessmentObjective requirementObjectives = 0
 repeated  sp800171AssessmentMethod requirementMethods = 0
 repeated  sp800171Reference requirementReferences = 0
 repeated  sp800171SourceControlIdentifier sourceControls = 0
 }
// One item of a requirement statement: a lettered item such as 03.01.01.a, or a numbered item under a lettered one such as 03.01.01.c.01.
message Sp800171RequirementItem
 {
  sp800171ItemIdentifier requirementItemId = 0
  string requirementItemText = 0
 repeated  sp800171RequirementItem requirementSubitems = 0
 }
