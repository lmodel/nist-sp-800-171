# metamodel_version: 1.12.0
# version: 3.0.0
enum Sp800171AssessmentMethodKind
  {
    examine
    interview
    test
  }

enum Sp800171RequirementStatus
  {
    withdrawn
  }

enum Sp800171SelectionCount
  {
    one
    one_or_more
  }

type Sp800171AssessmentMethod
  {
    requirementMethodKind: Sp800171AssessmentMethodKind!
    requirementMethodObjects: [String]!
  }

type Sp800171AssessmentObjective
  {
    requirementObjectiveId: Sp800171ObjectiveIdentifier!
    requirementDetermination: String!
    assessedRequirementItem: Sp800171ItemIdentifier
  }

type Sp800171Family
  {
    title: String!
    description: String
    familyNumber: Sp800171FamilyIdentifier!
    familyRequirements: [Sp800171Requirement]
  }

type Sp800171Parameter
  {
    odpId: Sp800171OdpIdentifier!
    odpLabel: String!
    odpUsage: String
    odpGuideline: String
    odpChoices: [String]
    odpSelectionCount: Sp800171SelectionCount
  }

type Sp800171Publication
  {
    sp800171Revision: String!
    requirementFamilies: [Sp800171Family]!
  }

type Sp800171Reference
  {
    citedPublication: Sp800171CitedPublicationName!
    citedPublicationCitation: String!
    citedPublicationUrl: String!
  }

type Sp800171Requirement
  {
    title: String
    description: String
    requirementId: Sp800171RequirementIdentifier!
    requirementStatus: Sp800171RequirementStatus
    incorporatedIntoRequirements: [Sp800171RequirementIdentifier]
    addressedByRequirements: [Sp800171RequirementIdentifier]
    requirementStatement: String
    requirementItems: [Sp800171RequirementItem]
    requirementDiscussion: String
    requirementParameters: [Sp800171Parameter]
    requirementObjectives: [Sp800171AssessmentObjective]
    requirementMethods: [Sp800171AssessmentMethod]
    requirementReferences: [Sp800171Reference]
    sourceControls: [Sp800171SourceControlIdentifier]
  }

type Sp800171RequirementItem
  {
    requirementItemId: Sp800171ItemIdentifier!
    requirementItemText: String!
    requirementSubitems: [Sp800171RequirementItem]
  }
